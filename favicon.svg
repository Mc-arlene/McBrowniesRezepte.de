<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cake body -->
  <rect x="5" y="15" width="22" height="14" rx="1.5" fill="#FFB3D9"/>

  <!-- Cake layers -->
